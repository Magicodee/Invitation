<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دعوة خطوبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:     #f6f0e6;
    --panel:  #efe6d6;
    --ink:    #3b2a22;
    --accent: #b08d57;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Cairo', sans-serif;
    overflow-x:hidden;
  }
  ::selection{ background:var(--accent); color:var(--bg); }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation:none !important; transition:none !important; }
  }

  /* =========================================================
     القسم الأول: صورة/فيديو الخلفية + الاسم
     ========================================================= */
  .hero{
    position:relative;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    background:var(--panel);
  }
  .bg-photo{
    position:absolute; inset:0;
    background-size:cover; background-position:center;
    transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .bg-photo.has-photo::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(59,42,34,.25) 0%, rgba(59,42,34,.55) 100%);
  }

  .bg-video{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; display:none; will-change:transform;
    transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .bg-video.is-active{ display:block; }

  /* تدرج خفيف فوق الفيديو عشان الاسم يبان بس من غير ما يخبي الفيديو */
  .video-overlay{
    position:absolute; inset:0; z-index:1;
    background:linear-gradient(180deg, rgba(30,20,15,.18) 0%, rgba(30,20,15,.5) 100%);
    pointer-events:none;
  }

  .hero-overlay{
    position:absolute; inset:0; z-index:2;
    background:var(--ink); opacity:0; pointer-events:none;
  }

  .hero-content{
    position:relative; z-index:3; text-align:center; padding: 40px 24px;
    max-width: 90%;
    opacity: 0;
    transform: scale(0.9);
    animation: boxReveal 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.3s;
  }

  @keyframes boxReveal {
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  .eyebrow-top{
    font-size:clamp(12px,2.4vw,15px);
    letter-spacing:.15em;
    color:var(--bg);
    text-shadow: 0 2px 10px rgba(0,0,0,.55);
    opacity:0; animation:fadeIn .9s ease forwards 1.3s;
    margin-bottom:20px;
  }

  .flourish{
    display:block; margin:0 auto;
    color:var(--accent);
    opacity:0;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.4));
  }
  .flourish-top{ width:min(78vw, 300px); height:auto; margin-bottom:4px; }
  .flourish-bottom{ width:min(34vw, 120px); height:auto; margin-top:8px; }
  .flourish-path{
    fill:none; stroke:currentColor; stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round;
  }

  .dots-row{
    display:flex; gap:7px; justify-content:center;
    margin:10px 0 18px;
    opacity:0; transform:translateY(6px);
    transition:opacity .6s ease, transform .6s ease;
  }
  .dots-row.show{ opacity:1; transform:translateY(0); }
  .dots-row .dot{ width:4px; height:4px; border-radius:50%; background:var(--accent); }

  .name-row{
    display:flex; align-items:center; justify-content:center; gap:18px;
  }
  .name-line{
    height:1px; background:var(--accent); flex:1; max-width:90px;
    opacity:0; transform:scaleX(0);
    transition:opacity .6s ease, transform .6s ease;
  }
  .name-line.start{ transform-origin:left; }
  .name-line.end{ transform-origin:right; }
  .name-row.show .name-line{ opacity:1; transform:scaleX(1); }

  /* فونت عربي مزخرف للاسم/الحروف */
  .monogram{
    display:inline-flex; align-items:baseline; justify-content:center;
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:clamp(48px, 11vw, 100px);
    letter-spacing:.04em;
    color:var(--bg);
    text-shadow: 0 4px 18px rgba(0,0,0,.55);
    white-space:nowrap;
  }
  .monogram .amp{ font-style:normal; color:var(--accent); }

  .monogram .rchar{
    display:inline-block;
    opacity:0;
    filter:blur(6px);
    transform:translateY(14px);
    animation:letterReveal .8s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes letterReveal{
    to{ opacity:1; filter:blur(0); transform:translateY(0); }
  }

  .hero-tagline{
    margin-top:28px;
    font-size:clamp(13px,2.2vw,16px);
    letter-spacing:.15em;
    color:var(--bg);
    text-shadow: 0 2px 10px rgba(0,0,0,.55);
    opacity:0; transform:translateY(8px);
    transition:opacity .7s ease, transform .7s ease;
  }
  .hero-tagline.show{ opacity:.95; transform:translateY(0); }

  @keyframes fadeIn{ to{ opacity:1; } }

  .scroll-cue{
    position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
    z-index:5; display:flex; flex-direction:column; align-items:center; gap:8px;
    font-size:11px; letter-spacing:.15em; color:var(--bg);
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
    opacity:.85;
  }
  .scroll-cue span{
    width:1px; height:30px; background:linear-gradient(var(--accent), transparent);
    animation:scrollPulse 1.8s ease-in-out infinite;
  }
  @keyframes scrollPulse{ 0%{ opacity:.2; } 50%{ opacity:1; } 100%{ opacity:.2; } }

  /* =========================================================
     القسم الثاني: التفاصيل + الخريطة
     ========================================================= */
  .details{
    position:relative;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:90px 24px 110px;
    background:var(--bg);
  }

  .reveal{ opacity:0; transform:translateY(30px); transition:opacity .8s ease, transform .8s ease; }
  .details.is-visible .reveal{ opacity:1; transform:translateY(0); }
  .details.is-visible .reveal:nth-of-type(1){ transition-delay:.05s; }
  .details.is-visible .reveal:nth-of-type(2){ transition-delay:.2s; }
  .details.is-visible .reveal:nth-of-type(3){ transition-delay:.35s; }
  .details.is-visible .reveal:nth-of-type(4){ transition-delay:.5s; }
  .details.is-visible .reveal:nth-of-type(5){ transition-delay:.65s; }

  .eyebrow{
    font-size:14px; letter-spacing:.15em;
    color:var(--accent); margin-bottom:22px;
  }

  .title{
    font-family:'Aref Ruqaa', serif;
    font-weight:400;
    font-size:clamp(26px, 4.6vw, 46px);
    line-height:1.7;
    max-width:680px;
    color:var(--ink);
    margin-bottom:46px;
  }
  .title .word{ display:inline-block; }

  .datetime{
    display:flex; align-items:center; justify-content:center; gap:36px;
    flex-wrap:wrap;
    margin-bottom: 54px;
  }
  .dt-block{ text-align:center; }
  .dt-label{
    font-size:12px; letter-spacing:.15em;
    color:var(--accent); margin-bottom:10px;
  }
  .dt-value{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:clamp(22px, 3.6vw, 30px);
    color:var(--ink);
    letter-spacing:.02em;
  }
  .dt-divider{
    width:1px; height:42px;
    background:var(--accent);
  }

  .countdown-title{ text-align:center; margin-top:30px; font-size:26px; color:var(--accent); font-family:'Aref Ruqaa', serif; }
  .countdown{ display:flex; justify-content:center; gap:15px; margin-top:20px; flex-wrap:wrap; }
  .box{ width:100px; height:110px; background:rgba(176,141,87,0.08); border:1px solid var(--accent); border-radius:15px; display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .number{ font-size:32px; font-weight:bold; color:var(--ink); }
  .label{ font-size:12px; opacity:0.7; color:var(--ink); }

  .location-map {
    width: 100%;
    max-width: 600px;
    height: 300px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 54px;
  }
  .location-map iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }

  .closing{
    margin-top:54px;
    font-size:16px;
    color:var(--ink);
    opacity:.8;
    max-width:460px;
  }

  @media (max-width:640px){
    .datetime{
    gap:20px; flex-direction:column; }
    .dt-divider{ width:60px; height:1px; }
    .name-line{ max-width:34px; }
  }
</style>
</head>
<body>

    <section class="hero">
    <div class="bg-photo" id="bgPhoto"></div>
<video
  class="bg-video is-active"
  id="bgVideo"
  muted
  autoplay
  loop
  playsinline
  preload="auto"
       >
</video>
    <div class="video-overlay"></div>

    <div class="hero-overlay" id="heroOverlay"></div>

    <div class="hero-content">
      <p class="eyebrow-top" id="eyebrowTop"></p>

      <svg class="flourish flourish-top" viewBox="0 0 300 70" aria-hidden="true">
        <path class="flourish-path" d="
          M150,10 C141,2 131,3 126,11 C121,19 128,27 137,24 C144,22 145,14 139,12
          M150,10 C159,2 169,3 174,11 C179,19 172,27 163,24 C156,22 155,14 161,12
          M126,18 C95,12 62,17 40,32 C27,41 20,46 12,44
          M174,18 C205,12 238,17 260,32 C273,41 280,46 288,44" />
      </svg>

      <div class="dots-row" id="dotsRow">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>

      <div class="name-row" id="nameRow">
        <span class="name-line start"></span>
        <h1 class="monogram" id="monogram"><span id="nameSlot"></span></h1>
        <span class="name-line end"></span>
      </div>

      <svg class="flourish flourish-bottom" viewBox="0 0 120 50" aria-hidden="true">
        <path class="flourish-path" d="
          M60,6 C46,6 36,15 36,25 C36,35 46,40 55,33 C58,30 58,21 54,18
          M60,6 C74,6 84,15 84,25 C84,35 74,40 65,33 C62,30 62,21 66,18" />
      </svg>

      <p class="hero-tagline" id="heroTagline"></p>
    </div>

    <div class="scroll-cue"><span></span>مرر لأسفل</div>
  </section>

    <section class="details" id="details">
    <p class="eyebrow reveal" id="eyebrow"></p>
    <h1 class="title reveal" id="title"></h1>
    <div class="datetime reveal">
      <div class="dt-block">
        <div class="dt-label" id="dateLabel"></div>
        <div class="dt-value" id="dateValue"></div>
      </div>
      <div class="dt-divider"></div>
      <div class="dt-block">
        <div class="dt-label" id="timeLabel"></div>
        <div class="dt-value" id="timeValue"></div>
      </div>
    </div>
<div class="countdown-title reveal">يوم فرحتنا</div>
<div class="countdown reveal">
  <div class="box"> <div id="days" class="number">0</div> <div class="label">يوم</div> </div>
  <div class="box"> <div id="hours" class="number">0</div> <div class="label">ساعة</div> </div>
  <div class="box"> <div id="minutes" class="number">0</div> <div class="label">دقيقة</div> </div>
  <div class="box"> <div id="seconds" class="number">0</div> <div class="label">ثانية</div> </div>
</div>

    <div class="location-map reveal">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d110502.61185368595!2d31.188339832873155!3d30.059618471138307!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14583fa60b21beeb%3A0x4374c2e36567c963!2sCairo%2C%20Cairo%20Governorate%!5e0!3m2!1sen!2seg!4v1716333671234!5m2!1sen!2seg" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <p class="closing reveal" id="closing"></p>
  </section>

<script>
/* =========================================================
   CONFIG — غير القيم دي بس عشان تتحكم في كل حاجة
   ========================================================= */
const CONFIG = {
  nameLeft:  "م",
  nameRight: "ي",
  heroTagline: "حفل خطوبة",
  video: "https://res.cloudinary.com/df5qqg0v0/video/upload/v1785957090/Children_preparing_for_portrait___202608052210_uf0mt5.mp4",
  photo: "",
  eyebrowTop: "بكل الحب والسعادة",
  eyebrow: "التفاصيل",
  title: "يسعدنا دعوتكم لمشاركتنا فرحة خطوبتنا",
  dateLabel: "التاريخ",
  dateValue: "٣٠ أغسطس ٢٠٢٦",
  timeLabel: "في تمام الساعة",
  timeValue: "٥:٠٠ مساءً",
  location: "",
  closing: "بانتظار حضوركم"
};
document.getElementById('eyebrowTop').textContent  = CONFIG.eyebrowTop;
document.getElementById('heroTagline').textContent = CONFIG.heroTagline;
document.getElementById('eyebrow').textContent      = CONFIG.eyebrow;
document.getElementById('dateLabel').textContent    = CONFIG.dateLabel;
document.getElementById('dateValue').textContent    = CONFIG.dateValue;
document.getElementById('timeLabel').textContent    = CONFIG.timeLabel;
document.getElementById('timeValue').textContent    = CONFIG.timeValue;
document.getElementById('closing').textContent      = CONFIG.closing;

/* ---------- خلفية الفيديو أو الصورة ---------- */
const bgVideoEl = document.getElementById('bgVideo');
const bgPhotoEl = document.getElementById('bgPhoto');
let videoReady = false;

if (CONFIG.video) {
  bgVideoEl.src = CONFIG.video;
  bgVideoEl.classList.add('is-active');

  bgVideoEl.addEventListener('loadedmetadata', () => {
    videoReady = true;
    bgVideoEl.play().catch(err => {
      console.log(err);
    });
  });

} else if (CONFIG.photo) {
  bgPhotoEl.style.backgroundImage = `url("${CONFIG.photo}")`;
  bgPhotoEl.classList.add('has-photo');
}

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- بناء الاسم + الفلوريش ---------- */
function sleep(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

function buildNameSequence(){
  const seq = [];
  CONFIG.nameLeft.split('').forEach(ch => seq.push({ ch, cls: '' }));
  CONFIG.nameRight.split('').forEach(ch => seq.push({ ch, cls: '' }));
  return seq;
}

function revealName(){
  const seq = buildNameSequence();
  const container = document.getElementById('nameSlot');
  seq.forEach((item, i) => {
    const span = document.createElement('span');
    span.className = (item.cls ? item.cls + ' ' : '') + 'rchar';
    span.style.animationDelay = (i * 0.06 + 1.25) + 's';
    span.textContent = item.ch;
    container.appendChild(span);
  });
  return seq.length;
}

function prepareFlourish(el){
  const path = el.querySelector('.flourish-path');
  const len = path.getTotalLength();
  path.style.strokeDasharray = len;
  path.style.strokeDashoffset = len;
  return path;
}

function drawFlourish(el, path, delay = 0){
  el.style.transition = 'opacity .5s ease';
  setTimeout(() => {
    el.style.opacity = '1';
    requestAnimationFrame(() => {
      path.style.transition = 'stroke-dashoffset 1.1s ease';
      path.style.strokeDashoffset = '0';
    });
  }, delay * 1000);
}

const flourishTopEl    = document.querySelector('.flourish-top');
const flourishBottomEl = document.querySelector('.flourish-bottom');

if (reduceMotion) {
  document.getElementById('nameSlot').textContent = CONFIG.nameLeft + CONFIG.nameRight;  flourishTopEl.style.opacity = '1';
  flourishBottomEl.style.opacity = '1';
  document.getElementById('dotsRow').classList.add('show');
  document.getElementById('nameRow').classList.add('show');
  document.getElementById('heroTagline').classList.add('show');
} else {
  const pathTop    = prepareFlourish(flourishTopEl);
  const pathBottom = prepareFlourish(flourishBottomEl);
  const letterCount = revealName();
  const typingDuration = letterCount * 60 + 1250 + 750;

  drawFlourish(flourishTopEl, pathTop, 1.35);

  setTimeout(() => {
    document.getElementById('dotsRow').classList.add('show');
  }, typingDuration);

  setTimeout(() => {
    document.getElementById('nameRow').classList.add('show');
  }, typingDuration + 150);

  drawFlourish(flourishBottomEl, pathBottom, (typingDuration + 400) / 1000);

  setTimeout(() => {
    document.getElementById('heroTagline').classList.add('show');
  }, typingDuration + 900);
}

/* تقسيم عنوان قسم التفاصيل لكلمات */
const titleEl = document.getElementById('title');
CONFIG.title.split(' ').forEach(word => {
  const span = document.createElement('span');
  span.className = 'word';
  span.textContent = word + '\u00A0';
  titleEl.appendChild(span);
});

/* ---------- ظهور قسم التفاصيل عند السكرول ---------- */
const detailsSection = document.getElementById('details');
const sectionObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) detailsSection.classList.add('is-visible');
  });
}, { threshold: 0.25 });
sectionObserver.observe(detailsSection);

/* ---------- السكرول يتحكم في حجم/موضع الفيديو ---------- */
const heroEl = document.querySelector('.hero');
const heroOverlayEl = document.getElementById('heroOverlay');
const bgLayer = bgVideoEl.classList.contains('is-active')
  ? bgVideoEl
  : bgPhotoEl;

if (!reduceMotion) {

  let ticking = false;

  function updateOnScroll() {
    const heroHeight = heroEl.offsetHeight;
    const progress = Math.min(
      Math.max(window.scrollY / heroHeight, 0),
      1
    );

    const scale = 1 + progress * 0.35;
    const lift = progress * 120;

    bgLayer.style.transform =
      `scale(${scale}) translate3d(0, ${-lift}px, 0)`;

    heroOverlayEl.style.opacity = progress * 0.65;

    document.querySelector('.hero-content').style.transform =
      `translateY(${progress * 80}px)`;

    document.querySelector('.hero-content').style.opacity =
      1 - (progress * 0.7);

    ticking = false;
  }

  window.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(updateOnScroll);
      ticking = true;
    }
  });

  updateOnScroll();
}

const weddingDate = new Date("August 30, 2026 15:37:25").getTime();
function updateCountdown(){
  const now = new Date().getTime();
  const distance = weddingDate - now;
  const days = Math.floor(distance / (1000*60*60*24));
  const hours = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
  const minutes = Math.floor((distance % (1000*60*60)) / (1000*60));
  const seconds = Math.floor((distance % (1000*60)) / 1000);
  document.getElementById("days").innerText = days;
  document.getElementById("hours").innerText = hours;
  document.getElementById("minutes").innerText = minutes;
  document.getElementById("seconds").innerText = seconds;
  if(distance < 0){
    clearInterval(timer);
    document.querySelector(".countdown").innerHTML = "<h2 style='color:#b08d57'>❤ بدأ الاحتفال ❤</h2>";
  }
}
const timer = setInterval(updateCountdown, 1000);
updateCountdown();
</script>
</body>
</html>
